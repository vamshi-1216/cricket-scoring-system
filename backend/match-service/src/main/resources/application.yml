server:
  port: 8083   # local port

spring:
  application:
    name: match-service

  datasource:
    url: jdbc:mysql://localhost:3306/cricketdata
    username: root
    password: password
    driver-class-name: com.mysql.cj.jdbc.Driver

  jpa:
    hibernate:
      ddl-auto: update
    show-sql: true
    properties:
      hibernate:
        dialect: org.hibernate.dialect.MySQLDialect

eureka:
  client:
    register-with-eureka: true     # 🔥 register service
    fetch-registry: true           # 🔥 discover others
    service-url:
      defaultZone: http://localhost:8761/eureka/

  instance:
    prefer-ip-address: true
    instance-id: ${spring.application.name}:${server.port}

logging:
  level:
    org.hibernate.SQL: INFO
