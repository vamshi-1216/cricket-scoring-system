server:
  port: 8085

spring:
  application:
    name: stats-service

  datasource:
    url: jdbc:mysql://localhost:3306/cricketdata
    username: root
    password: password
    driver-class-name: com.mysql.cj.jdbc.Driver

  jpa:
    hibernate:
      ddl-auto: update
    show-sql: true
    properties:
      hibernate:
        dialect: org.hibernate.dialect.MySQLDialect

eureka:
  client:
    register-with-eureka: true
    fetch-registry: true
    service-url:
      defaultZone: http://localhost:8761/eureka/

  instance:
    prefer-ip-address: true
    hostname: localhost

logging:
  level:
    org.hibernate.SQL: INFO
